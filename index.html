const contents={pt:[
{tag:'01 / PORQUÊ',title:'Porque é que um serviço digital ainda pode ser difícil?',desc:'Ter um portal não significa conseguir concluir um pedido sem ajuda. Queremos reduzir dúvidas, visitas repetidas e trabalho desnecessário.',art:'person',hint:'Este é um exemplo de aprendizagem. Não é um serviço oficial.'},

{tag:'03 / ENTRAR',title:'Como prefere entrar?',desc:'Para pedir online, pode utilizar a Chave Móvel Digital ou o Cartão de Cidadão com leitor e PIN. Aqui vamos apenas praticar.',art:'key',choices:['Chave Móvel Digital','Cartão + leitor'],detail:'Nunca introduza a sua palavra-passe, PIN ou códigos neste simulador. Use apenas o portal oficial para o pedido real.'},
{tag:'04 / PREPARAR',title:'Preparar é mais fácil do que recomeçar.',desc:'Tenha a nova morada e o meio de autenticação pronto. Confirme os requisitos atuais no portal oficial antes de começar.',art:'documents',detail:'Os documentos e dados necessários variam conforme a situação. Este exemplo não substitui as regras oficiais atualizadas.'},
{tag:'05 / PEDIR',title:'Agora, faça o pedido no portal oficial.',desc:'No gov.pt, escolha alterar a morada, autentique-se e siga os campos indicados. Aqui não fazemos qualquer pedido real.',art:'phone',hint:'Não existe transmissão de dados para o Governo nesta demonstração.'},

{tag:'07 / CONFIRMAR',title:'Recebeu a carta? É hora de confirmar.',desc:'Use os dados de confirmação da carta através de um canal oficial, dentro do prazo indicado. Só então o processo termina.',art:'documents',hint:'Não partilhe códigos da carta neste simulador.'},

{tag:'01 / WHY',title:'Why can digital services still feel difficult?',desc:'A government portal does not guarantee everyone can complete a request without help. Our goal is to reduce confusion, repeat visits and avoidable work.',art:'person',hint:'This is a learning example, not an official government service.'},
{tag:'02 / CHOOSE',title:'Let’s change a Citizen Card address.',desc:'We chose a real, commonly assisted national service available on gov.pt and supported by Tondela Citizen Spaces.',art:'phone',hint:'This is a national service, not a Tondela-only municipal procedure.'},
{tag:'03 / SIGN IN',title:'How would you prefer to sign in?',desc:'To request this online, use your Digital Mobile Key or Citizen Card with reader and PIN. Here we only practise.',art:'key',choices:['Digital Mobile Key','Card + reader'],detail:'Never enter your password, PIN or codes into this simulation. Use only the official portal for real requests.'},
{tag:'04 / PREPARE',title:'Preparing is easier than starting over.',desc:'Have your new address and authentication method ready. Check current requirements on the official website first.',art:'documents',detail:'Required information can vary by situation. This example does not replace up-to-date official rules.'},

let index=0,lang='pt',choice=-1,openDetail=false;const $=id=>document.getElementById(id);const c={pt:{back:'Voltar',next:'Seguinte',finish:'Recomeçar',listen:'Ouvir',stop:'Parar',more:'Ver mais',less:'Ver menos',note:'Pode voltar atrás ou ouvir novamente. Sem pressa.',disclaimer:'PROTÓTIPO EDUCATIVO · Dados fictícios · Sem ligação à Administração Pública · Não recolhe informação pessoal',sources:'Fontes oficiais:'},en:{back:'Back',next:'Next',finish:'Restart',listen:'Listen',stop:'Stop',more:'More details',less:'Hide details',note:'Go back or listen again. Take your time.',disclaimer:'EDUCATIONAL PROTOTYPE · Synthetic data · No government connection · No personal information collected',sources:'Official sources:'}};function speak(){speechSynthesis.cancel();const a=contents[lang][index],u=new SpeechSynthesisUtterance(a.title+'. '+a.desc);u.lang=lang==='pt'?'pt-PT':'en-GB';u.rate=.9;u.onend=()=>{$('listenLabel').textContent=c[lang].listen};speechSynthesis.speak(u);$('listenLabel').textContent=c[lang].stop}function render(){speechSynthesis.cancel();const a=contents[lang][index],t=c[lang];document.documentElement.lang=lang;$('status').textContent=lang==='pt'?'SIMULAÇÃO · NÃO É SERVIÇO OFICIAL':'SIMULATION · NOT AN OFFICIAL SERVICE';$('count').textContent=(index+1)+' / '+contents[lang].length;$('bar').style.width=((index+1)/contents[lang].length*100)+'%';$('progress').setAttribute('aria-valuenow',index+1);$('section').textContent=a.tag;$('title').textContent=a.title;$('desc').textContent=a.desc;$('art').innerHTML=wrap(art[a.art],a.tag);$('note').textContent=t.note;$('disclaimer').textContent=t.disclaimer;$('sourceLabel').textContent=t.sources;$('listenLabel').textContent=t.listen;$('backLabel').textContent=t.back;$('nextLabel').textContent=index===8?t.finish:t.next;$('back').disabled=index===0;$('choices').innerHTML='';if(a.choices){a.choices.forEach((v,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=v;b.setAttribute('aria-pressed',String(choice===i));b.onclick=()=>{choice=i;render()};$('choices').appendChild(b)})}if(a.detail){let b=document.createElement('button');b.className='choice';b.textContent=openDetail?t.less:t.more;b.onclick=()=>{openDetail=!openDetail;render()};$('choices').appendChild(b);$('details').hidden=!openDetail;$('details').textContent=a.detail}else{$('details').hidden=true;$('details').textContent=''}$('hint').textContent=a.hint||''} $('lang').addEventListener('change',e=>{lang=e.target.value;render()});$('back').onclick=()=>{index=Math.max(0,index-1);choice=-1;openDetail=false;render()};$('next').onclick=()=>{index=index===8?0:index+1;choice=-1;openDetail=false;render()};$('listen').onclick=()=>{if(speechSynthesis.speaking){speechSynthesis.cancel();$('listenLabel').textContent=c[lang].listen}else speak()};render();
